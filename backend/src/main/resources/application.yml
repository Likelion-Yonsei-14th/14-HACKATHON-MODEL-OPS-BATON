spring:
  application:
    name: baton

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  datasource:
    url: ${BATON_DB_URL:jdbc:postgresql://localhost:5432/baton}
    username: ${BATON_DB_USERNAME:baton}
    password: ${BATON_DB_PASSWORD:baton}
    hikari:
      maximum-pool-size: ${BATON_DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Model Lab shares the production Postgres database but must never contend with the production
    # backend's own Flyway history for version numbers (both apps independently reached "V5" and
    # collided in practice — see docs/GABIA_DEPLOY_INCIDENT.md). Tracking history in a separate table
    # decouples the two version sequences entirely: production owns flyway_schema_history, Model Lab
    # owns flyway_schema_history_model_lab, and neither validates against the other's migration files.
    table: flyway_schema_history_model_lab
    baseline-on-migrate: true
    baseline-version: "7"
    baseline-description: "Physical schema already carries V1-V7 (production V1-V4 plus Model Lab V5-V7, applied before the separate-table split)"

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
  model: ${OLLAMA_MODEL:qwen3:0.6b}

security:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:CHANGE_ME}

slack:
  client-id: ${SLACK_CLIENT_ID:}
  client-secret: ${SLACK_CLIENT_SECRET:}
  signing-secret: ${SLACK_SIGNING_SECRET:}
  redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/api/platform-connections/slack/callback}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: ${BATON_SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
