spring:
  datasource:
    url: jdbc:h2:mem:baton;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

openai:
  api-key: test-key
  model: gpt-4o-mini
  base-url: https://api.openai.com/v1

security:
  token-encryption-key: test-token-encryption-key

slack:
  client-id: test-client-id
  client-secret: test-client-secret
  signing-secret: test-signing-secret
  redirect-uri: http://localhost:8080/api/platform-connections/slack/callback

app:
  frontend-url: http://localhost:5173
