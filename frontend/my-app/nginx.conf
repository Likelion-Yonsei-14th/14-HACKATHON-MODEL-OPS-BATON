server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://model-lab-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A Classification eval run against dozens/hundreds of cases runs synchronously in one
        # HTTP request (see ClassificationEvalRunnerService docstring) and the local Qwen3 model is
        # much slower than OpenAI — the 60s default here would kill a CORE/HOLDOUT run partway
        # through.
        proxy_read_timeout 2400s;
        proxy_send_timeout 2400s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
